name: Build and deploy

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly refresh of the Wikipedia term list

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install parser dependency
        run: pip install beautifulsoup4
      - name: Unit tests
        run: |
          python -m unittest discover tests -v
          node --test tests/*.mjs
      - name: Fetch and parse Wikipedia term list
        run: python scripts/build_terms.py --list
      - name: Week number for the music cache
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache compressed music
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/music-cache
          key: music-${{ steps.week.outputs.week }}-${{ hashFiles('scripts/fetch_music.py') }}
          restore-keys: music-
      - name: Fetch lo-fi music from Google Drive
        continue-on-error: true
        env:
          MUSIC_CACHE: ${{ runner.temp }}/music-cache
          MUSIC_DRIVE_FOLDER: ${{ vars.MUSIC_DRIVE_FOLDER }}
        run: |
          pip install gdown
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python scripts/fetch_music.py
      - name: List music tracks in audio/
        run: |
          python scripts/build_music.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
